name: Deploy Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Optional: validate JSON manifest (can be removed)
      - name: Validate games.json
        run: |
          python - <<'PY'
          import json, sys
          with open('games.json','r', encoding='utf-8') as f:
              data = json.load(f)
          assert isinstance(data, list), "games.json must be a JSON array"
          for i,g in enumerate(data):
              assert 'url' in g and 'title' in g, f"Missing fields in game #{i}"
          print("games.json OK")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'   # deploy whole repository root

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

